[package]
name = "oxidizedoasis-websands"
version = "0.1.0"
edition = "2021"

[features]
default = []
test-utils = []

[dependencies]
mime = "0.3.17"
actix-web = { version = "=4.11.0"}
actix-files = "0.6"
actix-cors = "0.7"
sqlx = { version = "=0.8.6", features = ["runtime-tokio-rustls", "postgres", "macros", "chrono", "uuid", "json"] }
home = "=0.5.11" # Attempt to force an older version
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
dotenv = "0.15"
env_logger = "0.11.8"
log = "0.4"
bcrypt = "0.17.0"
uuid = { version = "1.17", features = ["v4", "serde"] }
async-trait = "0.1.88"
mockall = "^0.13.1" # Moved from dev-dependencies
jsonwebtoken = "9.3"
serde_json = "1.0.142"
actix-web-httpauth = "0.8"
futures = "0.3.31"
futures-util = "0.3.31"
lettre = { version = "=0.11.18", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
rand = "0.9.2"
chrono = { version = "0.4", features = ["serde"] }
validator = { version = "0.20", features = ["derive"] }
regex = "1.11"
lazy_static = "1.5"
ammonia = "=4.1.1"
actix-rt = "2.10"
url = "=2.5.4"
derive_more = { version = "2.0.1", features = ["display", "error", "from", "debug"] }
num_cpus = "1.17.0"
dashmap = "6.1.0"
indexmap = "2.10" # For validator's IndexMap usage if needed directly

time = { version = "0.3", features = ["serde"] }


[dev-dependencies]
actix-rt = "2.10"
sqlx = { version = "=0.8.6", features = ["runtime-tokio-rustls", "postgres", "macros", "chrono", "uuid", "json"] }
dotenv = "0.15"
uuid = { version = "1.17", features = ["v4", "serde"] }
# mockall = "^0.12.1" # Removed from dev-dependencies as it's now in [dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
sqlformat = "=0.3.5"
predicates = "3.1.3" # For predicates::option::lift_option
test_common = { path = "tests/common" }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[workspace]
members = [
    ".",
    "frontend"
]

