[package]
name = "frontend"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
yew = { version = "0.21.0", features = ["csr"] }
yew-hooks = "0.3.4"
yew-router = "0.18.0"

js-sys = "0.3.77"
wasm-bindgen = "0.2.100"
web-sys = { version = "0.3.77", features = [
    "Window",
    "Document",
    "HtmlTextAreaElement",
    "HtmlInputElement",
    "WorkerGlobalScope",
    "WorkerOptions",
    "RequestCredentials",
    "CustomEvent",
    "CustomEventInit",
    "Event",
    "EventTarget",
    "Element",
    "HtmlSelectElement"
]}
gloo = "0.11.0"
gloo-timers = "0.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen-futures = "0.4.50"
log = "0.4.27"
chrono = { version = "0.4.41", features = ["serde"] }
base64 = "0.22.1"
