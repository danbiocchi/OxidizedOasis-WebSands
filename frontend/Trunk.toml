[build]
target = "index.html"
dist = "dist"
public_url = "/"

[serve]
port = 8081
no_autoreload = true

[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = ["-c", "mkdir -p dist/static/css/core dist/static/css/components/nav dist/static/css/components/forms dist/static/css/layouts dist/static/css/utils dist/static/css/pages/home dist/static/css/pages/about dist/static/css/pages/auth dist/static/css/pages/dashboard"]


[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["-c", "cp -r static/* dist/static/ 2>/dev/null || true"]

[watch]
watch = ["src", "static"]

[clean]
dist = "dist"
cargo = false

[build.css]
minify = true
source_maps = true

[[hooks]]
stage = "build"
command = "sh"
command_arguments = ["-c", "cp -r static/css/core/*.css dist/static/css/core/ 2>/dev/null || true && cp -r static/css/components/nav/*.css dist/static/css/components/nav/ 2>/dev/null || true && cp -r static/css/components/forms/*.css dist/static/css/components/forms/ 2>/dev/null || true && cp -r static/css/components/*.css dist/static/css/components/ 2>/dev/null || true && cp -r static/css/layouts/*.css dist/static/css/layouts/ 2>/dev/null || true && cp -r static/css/utils/*.css dist/static/css/utils/ 2>/dev/null || true && cp -r static/css/pages/home/*.css dist/static/css/pages/home/ 2>/dev/null || true && cp -r static/css/pages/about/*.css dist/static/css/pages/about/ 2>/dev/null || true && cp -r static/css/pages/auth/*.css dist/static/css/pages/auth/ 2>/dev/null || true && cp -r static/css/pages/dashboard/*.css dist/static/css/pages/dashboard/ 2>/dev/null || true && cp -r static/css/*.css dist/static/css/ 2>/dev/null || true"]
